<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StockFlow | Dashboard</title>
<style>
:root{color-scheme:light;--black:#111;--ink:#222;--muted:#777;--line:#dedede;--paper:#f5f5f5;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 Arial,Helvetica,system-ui,sans-serif}
button,input{font:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr)}
.sidebar{background:#111;color:#fff;padding:24px 16px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}
.brand-mark{width:34px;height:34px;background:#fff;color:#111;display:grid;place-items:center;font-weight:900;font-size:20px}
.brand-name{font-weight:800;font-size:17px;letter-spacing:-.4px}
.brand-sub{color:#aaa;font-size:10px;text-transform:uppercase;letter-spacing:.14em}
.sidebar-note{margin-top:auto;padding:15px 8px 0;border-top:1px solid #393939;color:#888;font-size:11px}
.main{min-width:0;padding:28px clamp(18px,3vw,42px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#777;font-weight:800}
h1{font-size:30px;letter-spacing:-1px;margin:5px 0 0}
.search{display:flex;width:min(100%,600px);margin-bottom:24px;background:#fff;border:1px solid #cfcfcf}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:14px 15px;outline:none}
.search input:focus{box-shadow:inset 0 0 0 2px #777}
.search button{border:0;border-left:1px solid #cfcfcf;background:#111;color:#fff;font-size:11px;font-weight:800;padding:0 18px}
.workspace{min-height:calc(100vh - 165px);background:#fff;border:1px solid var(--line)}
@media(max-width:650px){.app{grid-template-columns:1fr}.sidebar{padding:13px 16px}.sidebar-note{display:none}.main{padding:20px 14px}.topbar{margin-bottom:22px}h1{font-size:26px}.workspace{min-height:calc(100vh - 170px)}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div><div class="brand-name">StockFlow</div><div class="brand-sub">Operations</div></div>
    </div>
    <div class="sidebar-note">Workspace</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><div class="eyebrow">StockFlow / Workspace</div><h1>Dashboard</h1></div>
    </header>
    <form class="search" id="searchForm">
      <input id="searchInput" type="search" placeholder="Search…" aria-label="Search">
      <button type="submit">SEARCH</button>
    </form>
    <section class="workspace" aria-label="Blank dashboard workspace"></section>
  </main>
</div>
<script>
document.getElementById("searchForm").addEventListener("submit", function(event) {
  event.preventDefault();
});
</script>
</body>
</html>
